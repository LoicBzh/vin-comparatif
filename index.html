<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#4B1D3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>Vin Comparatif</title>
<style>
:root{--bg:#1A0F1A;--card:#2D1B2E;--accent:#C9A86A;--text:#F5F1EB}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;padding-top:32px;position:relative}
h1{font-size:1.4rem;margin-bottom:16px;color:var(--accent)}

.creator{
  position:absolute;top:210px;left:8px;transform:rotate(-90deg);transform-origin:left center;
  font-size:0.75rem;opacity:0.4;color:var(--text);white-space:nowrap;z-index:10;
}

.notification{
  position:fixed;top:12px;left:12px;right:12px;padding:12px 16px;border-radius:12px;
  background:var(--card);border-left:4px solid var(--accent);z-index:2000;
  display:none;animation:slideIn 0.3s ease;
}
.notification.show{display:block}
.notification.error{border-left-color:#E22134}
.notification.success{border-left-color:#22C55E}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}

.nav{display:flex;gap:8px;margin-bottom:16px}
.nav button{flex:1;padding:12px;background:var(--card);border:none;color:var(--text);border-radius:12px;font-weight:600}
.nav button.active{background:var(--accent);color:#1A0F1A}
.nav button:disabled{opacity:0.5;cursor:not-allowed}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
input,textarea,select{
  width:100%;background:#1A0F1A;border:1px solid #ffffff1a;border-radius:12px;
  padding:12px;color:var(--text);font-size:1rem;margin-bottom:12px
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
input:disabled,textarea:disabled,select:disabled{opacity:0.5;cursor:not-allowed}
label{font-size:0.85rem;opacity:0.7;margin-bottom:6px;display:block}
button{border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:600;width:100%;cursor:pointer;transition:opacity 0.2s}
button:active{opacity:0.8}
.btn-primary{background:var(--accent);color:#1A0F1A}
.btn-secondary{background:#ffffff1a;color:var(--text)}
.btn-danger{background:#E22134;color:white}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:12px;display:none}

#photoCamera, #photoGallery{
  position:absolute;
  left:-9999px;
  width:1px;
  height:1px;
  opacity:0;
}

.wine-item{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
.wine-item img{width:80px;height:80px;object-fit:cover;border-radius:12px;cursor:pointer;flex-shrink:0}
.wine-content{flex:1}
.wine-name{font-size:1.1rem;font-weight:700;color:var(--accent)}
.wine-meta{font-size:0.9rem;opacity:0.8;margin:4px 0}
.wine-date{font-size:0.8rem;opacity:0.6;margin-top:4px}
.stars{color:#C9A86A;font-size:1.2rem}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{padding:10px;font-size:0.9rem}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.modal-zoom-container{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.modal img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center}
.modal-close{position:absolute;top:20px;right:20px;font-size:2rem;color:white;background:none;border:none;z-index:1001;cursor:pointer}

.filter-row{display:flex;gap:8px;margin-bottom:12px}
.filter-row select{margin-bottom:0}
</style>
</head>
<body>
<div class="notification" id="notification"></div>
<div class="creator">Built by Loïc D.</div>
<h1>🍷 Comparatif Vin</h1>

<div class="nav">
  <button id="navAdd" class="active" onclick="switchScreen('add')">Ajouter</button>
  <button id="navRank" onclick="switchScreen('rank')">Classement</button>
</div>

<div class="screen active" id="screenAdd">
  <div class="card">
    <label>Nom du vin</label>
    <input type="text" id="name" placeholder="Château Margaux">

    <label>Région</label>
    <select id="region">
      <option value="">-- Choisir une région --</option>
      <option value="Bordeaux">Bordeaux</option>
      <option value="Sud-Ouest">Sud-Ouest</option>
      <option value="Bourgogne">Bourgogne</option>
      <option value="Champagne">Champagne</option>
      <option value="Vallée du Rhône">Vallée du Rhône</option>
      <option value="Loire">Loire</option>
      <option value="Alsace">Alsace</option>
      <option value="Languedoc-Roussillon">Languedoc-Roussillon</option>
      <option value="Toscane">Toscane</option>
      <option value="Piémont">Piémont</option>
      <option value="Rioja">Rioja</option>
      <option value="Ribera del Duero">Ribera del Duero</option>
      <option value="Douro">Douro</option>
      <option value="Napa Valley">Napa Valley</option>
      <option value="Mendoza">Mendoza</option>
      <option value="Central Valley">Central Valley</option>
      <option value="Barossa Valley">Barossa Valley</option>
      <option value="Marlborough">Marlborough</option>
      <option value="Autre">Autre</option>
    </select>

    <label>Année</label>
    <input type="number" id="year" placeholder="2018" min="1900" max="2099">

    <label>Note /5</label>
    <select id="rating">
      <option value="5">★★★★★ 5/5</option>
      <option value="4">★★★★☆ 4/5</option>
      <option value="3">★★★☆☆ 3/5</option>
      <option value="2">★★☆☆☆ 2/5</option>
      <option value="1">★☆☆☆☆ 1/5</option>
    </select>

    <label>Notes de dégustation</label>
    <textarea id="notes" rows="3" placeholder="Nez, bouche, finale..."></textarea>

    <label>Photo de la bouteille</label>
    <div class="photo-btns">
      <button class="btn-secondary" onclick="takePhoto()">📷 Prendre une photo</button>
      <button class="btn-secondary" onclick="choosePhoto()">🖼️ Choisir une photo</button>
    </div>
    <input type="file" id="photoCamera" accept="image/*" capture="environment">
    <input type="file" id="photoGallery" accept="image/*">
    <img id="preview" class="photo-preview">

    <button class="btn-primary" id="submitBtn" onclick="addWine()">Ajouter au comparatif</button>
  </div>

  <div class="card">
    <h3>Mes vins récents</h3>
    <div id="recentList"></div>
  </div>
</div>

<div class="screen" id="screenRank">
  <div class="card">
    <h3 style="margin-bottom:12px">Classement par note</h3>

    <div class="filter-row">
      <select id="filterRegion" onchange="loadRank()">
        <option value="">Toutes les régions</option>
        <option value="Bordeaux">Bordeaux</option>
        <option value="Sud-Ouest">Sud-Ouest</option>
        <option value="Bourgogne">Bourgogne</option>
        <option value="Champagne">Champagne</option>
        <option value="Vallée du Rhône">Vallée du Rhône</option>
        <option value="Loire">Loire</option>
        <option value="Alsace">Alsace</option>
        <option value="Languedoc-Roussillon">Languedoc-Roussillon</option>
        <option value="Toscane">Toscane</option>
        <option value="Piémont">Piémont</option>
        <option value="Rioja">Rioja</option>
        <option value="Ribera del Duero">Ribera del Duero</option>
        <option value="Douro">Douro</option>
        <option value="Napa Valley">Napa Valley</option>
        <option value="Mendoza">Mendoza</option>
        <option value="Central Valley">Central Valley</option>
        <option value="Barossa Valley">Barossa Valley</option>
        <option value="Marlborough">Marlborough</option>
        <option value="Autre">Autre</option>
      </select>
    </div>

    <div id="rankList"></div>
    <button class="btn-secondary" onclick="exportJSON()" style="margin-top:12px">📥 Exporter JSON</button>
    <button class="btn-secondary" onclick="importJSON()" style="margin-top:8px">📤 Importer JSON</button>
    <button class="btn-danger" onclick="clearAll()" style="margin-top:8px">🗑️ Tout effacer</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<div class="modal" id="photoModal">
  <button class="modal-close" onclick="closeModal()" title="Fermer">×</button>
  <div class="modal-zoom-container" id="zoomContainer">
    <img id="modalImg" alt="Aperçu photo">
  </div>
</div>

<div class="modal" id="importModal">
  <div class="card" style="max-width:320px;text-align:center">
    <h3 style="margin-bottom:12px">Importer des vins</h3>
    <p id="importMsg" style="margin-bottom:16px;opacity:0.8"></p>
    <div style="display:flex;gap:8px">
      <button class="btn-primary" id="btnMerge">Fusionner</button>
      <button class="btn-danger" id="btnOverwrite">Remplacer</button>
    </div>
    <button class="btn-secondary" id="btnCancel" style="margin-top:8px">Annuler</button>
  </div>
</div>

<script>
const el = id => document.getElementById(id);
let currentPhoto = null;
let editingId = null;
let scale=1,startDist=0,startScale=1;
let storageAvailable = false;

// ===== CONSTANTS =====
const REGIONS = [
  'Bordeaux','Sud-Ouest','Bourgogne','Champagne','Vallée du Rhône','Loire','Alsace',
  'Languedoc-Roussillon','Toscane','Piémont','Rioja','Ribera del Duero','Douro',
  'Napa Valley','Mendoza','Central Valley','Barossa Valley','Marlborough','Autre'
];

// ===== UTILS =====
function escapeHtml(text){
  const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return text.replace(/[&<>"']/g, m => map[m]);
}

function showNotification(msg, type='info', duration=3000){
  const notif = el('notification');
  notif.textContent = msg;
  notif.className = `notification show ${type}`;
  setTimeout(() => notif.classList.remove('show'), duration);
}

function checkStorage(){
  try{
    const test = '__storage_test__';
    localStorage.setItem(test, test);
    localStorage.removeItem(test);
    return true;
  } catch(e){
    return false;
  }
}

function initApp(){
  storageAvailable = checkStorage();
  if(!storageAvailable){
    document.querySelectorAll('.nav button').forEach(b => b.disabled = true);
    showNotification('❌ Stockage local non disponible', 'error', 5000);
    return;
  }
  loadRecent();
  loadRank();
}

// ===== SCREEN NAVIGATION =====
function switchScreen(screen){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if(screen==='add'){
    el('screenAdd').classList.add('active');
    el('navAdd').classList.add('active');
    loadRecent();
  }
  if(screen==='rank'){
    el('screenRank').classList.add('active');
    el('navRank').classList.add('active');
    loadRank();
  }
}

// ===== PHOTO HANDLING =====
function takePhoto(){el('photoCamera').click();}
function choosePhoto(){el('photoGallery').click();}

function handlePhoto(file){
  if(!file) return;
  
  // Vérifier taille
  const maxSize = 5 * 1024 * 1024; // 5MB
  if(file.size > maxSize){
    showNotification('❌ Image trop grande (max 5MB)', 'error');
    return;
  }

  const img = new Image();
  const reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => {
      const maxWidth = 800;
      const scale = Math.min(maxWidth / img.width, 1);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      currentPhoto = canvas.toDataURL('image/jpeg', 0.7);
      el('preview').src = currentPhoto;
      el('preview').style.display = 'block';
      showNotification('✓ Photo compressée', 'success', 2000);
    };
    img.onerror = () => {
      showNotification('❌ Image corrompue', 'error');
    };
    img.src = ev.target.result;
  };
  reader.onerror = () => {
    showNotification('❌ Erreur lecture fichier', 'error');
  };
  reader.readAsDataURL(file);
}

el('photoCamera').addEventListener('change', e => handlePhoto(e.target.files[0]));
el('photoGallery').addEventListener('change', e => handlePhoto(e.target.files[0]));

// ===== WINE MANAGEMENT =====
function addWine(){
  if(!storageAvailable){
    showNotification('❌ Stockage indisponible', 'error');
    return;
  }

  const name = el('name').value.trim();
  if(!name){
    showNotification('⚠️ Ajoute un nom de vin', 'error');
    return;
  }

  let list = JSON.parse(localStorage.getItem('wineList')||'[]');
  const wineData = {
    name,
    region: el('region').value,
    year: el('year').value || '',
    rating: parseInt(el('rating').value),
    notes: el('notes').value.trim(),
    photo: currentPhoto
  };

  if(editingId){
    list = list.map(w => w.id === editingId? {...w,...wineData} : w);
    editingId = null;
    el('submitBtn').textContent = 'Ajouter au comparatif';
  } else {
    const wine = {
      id:Date.now(),
      ...wineData,
      date: new Date().toLocaleString('fr-FR')
    };
    list.unshift(wine);
  }

  try{
    localStorage.setItem('wineList', JSON.stringify(list));
    clearForm();
    loadRecent();
    loadRank();
    showNotification(editingId===null ? '✓ Vin ajouté!' : '✓ Vin modifié!', 'success');
  } catch(e){
    if(e.name === 'QuotaExceededError'){
      showNotification('💾 Stockage plein! Exporte et efface des vins.', 'error', 5000);
    } else {
      showNotification('❌ Erreur: ' + e.message, 'error');
    }
  }
}

function editWine(id){
  const list = JSON.parse(localStorage.getItem('wineList')||'[]');
  const wine = list.find(w => w.id === id);
  if(!wine) return;

  editingId=id;
  el('name').value=wine.name;
  el('region').value=wine.region||'';
  el('year').value=wine.year;
  el('rating').value=wine.rating;
  el('notes').value=wine.notes;
  currentPhoto=wine.photo;

  if(wine.photo){
    el('preview').src=wine.photo;
    el('preview').style.display='block';
  }
  el('submitBtn').textContent='💾 Enregistrer les modifs';
  switchScreen('add');
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearForm(){
  editingId=null;
  el('name').value='';
  el('region').value='';
  el('year').value='';
  el('rating').value='5';
  el('notes').value='';
  el('photoCamera').value='';
  el('photoGallery').value='';
  currentPhoto=null;
  el('preview').style.display='none';
  el('submitBtn').textContent='Ajouter au comparatif';
}

function deleteWine(id){
  if(!confirm('Supprimer ce vin?'))return;
  let list=JSON.parse(localStorage.getItem('wineList')||'[]');
  list=list.filter(w=>w.id!==id);
  try{
    localStorage.setItem('wineList',JSON.stringify(list));
    loadRecent();
    loadRank();
    showNotification('✓ Vin supprimé', 'success', 2000);
  } catch(e){
    showNotification('❌ Erreur suppression', 'error');
  }
}

// ===== DISPLAY FUNCTIONS =====
function loadRecent(){
  const list=JSON.parse(localStorage.getItem('wineList')||'[]');
  el('recentList').innerHTML=list.slice(0,3).map(w=>renderWineItem(w,false)).join('')||
    '<div style="opacity:0.6;text-align:center;padding:20px">Aucun vin</div>';
}

function loadRank(){
  let list=JSON.parse(localStorage.getItem('wineList')||'[]');

  const filterVal = el('filterRegion').value;
  if(filterVal){
    list = list.filter(w => w.region === filterVal);
  }

  list.sort((a,b)=>b.rating-a.rating||b.year-a.year);

  el('rankList').innerHTML=list.map(w=>renderWineItem(w,true)).join('')||
    '<div style="opacity:0.6;text-align:center;padding:20px">Aucun vin dans cette région</div>';
}

function renderWineItem(w,showActions){
  const photoHtml = w.photo ? `<img src="${w.photo}" alt="${escapeHtml(w.name)}" onclick="openModal('${w.photo}')" loading="lazy">` : '';
  const dateHtml = w.date ? `<div class="wine-date">📅 ${escapeHtml(w.date)}</div>` : '';
  const notesHtml = w.notes ? `<div class="wine-meta">${escapeHtml(w.notes)}</div>` : '';
  const actionsHtml = showActions ? `<div class="actions">
    <button class="btn-secondary" onclick="editWine(${w.id})">✏️ Modifier</button>
    <button class="btn-danger" onclick="deleteWine(${w.id})">🗑️ Supprimer</button>
  </div>` : '';

  return `<div class="wine-item">
    ${photoHtml}
    <div class="wine-content">
      <div class="wine-name">${escapeHtml(w.name)}</div>
      <div class="wine-meta">${escapeHtml(w.region||'Région inconnue')} ${w.year?`• ${escapeHtml(w.year)}`:''}</div>
      <div class="stars">${'★'.repeat(w.rating)}${'☆'.repeat(5-w.rating)} ${w.rating}/5</div>
      ${notesHtml}
      ${dateHtml}
      ${actionsHtml}
    </div>
  </div>`;
}

// ===== MODAL & ZOOM =====
function openModal(src){
  if(!src){
    showNotification('❌ Image indisponible', 'error');
    return;
  }
  el('modalImg').src=src;
  el('photoModal').classList.add('active');
  scale=1;
  el('modalImg').style.transform='scale(1)';
}

function closeModal(){
  el('photoModal').classList.remove('active');
  scale=1;
  el('modalImg').style.transform='scale(1)';
}

el('photoModal').addEventListener('click',e=>{if(e.target===el('photoModal'))closeModal()});

function getDistance(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

const zoomContainer=el('zoomContainer');
const zoomImg=el('modalImg');

zoomContainer.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});

zoomContainer.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    startDist=getDistance(e.touches);
    startScale=scale;
  }
},{passive:false});

zoomContainer.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dist=getDistance(e.touches);
    const newScale=startScale*(dist/startDist);
    scale=Math.min(Math.max(1,newScale),4);
    zoomImg.style.transform=`scale(${scale})`;
  }
},{passive:false});

zoomContainer.addEventListener('touchend',e=>{
  if(e.touches.length<2)startDist=0;
},{passive:false});

// ===== IMPORT/EXPORT =====
function clearAll(){
  if(!confirm('⚠️ Effacer TOUT le comparatif? Cette action est irréversible.'))return;
  try{
    localStorage.removeItem('wineList');
    loadRecent();
    loadRank();
    showNotification('✓ Comparatif vidé', 'success');
  } catch(e){
    showNotification('❌ Erreur effacement', 'error');
  }
}

function exportJSON(){
  try{
    const list=localStorage.getItem('wineList');
    if(!list || list === '[]'){
      showNotification('⚠️ Aucun vin à exporter', 'error');
      return;
    }
    const blob=new Blob([list],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`vins-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showNotification('✓ Exporté avec succès', 'success', 2000);
  } catch(e){
    showNotification('❌ Erreur export: ' + e.message, 'error');
  }
}

function importJSON(){
  el('importFile').click();
}

el('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const importedData = JSON.parse(ev.target.result);
      if(!Array.isArray(importedData)) throw new Error('Format invalide');
      if(importedData.length === 0) throw new Error('Fichier vide');

      const currentData = JSON.parse(localStorage.getItem('wineList') || '[]');

      el('importMsg').textContent = `📄 Fichier: ${importedData.length} vin(s)\n🗂️ Actuellement: ${currentData.length} vin(s)`;
      el('importModal').classList.add('active');

      const doImport = (mode) => {
        el('importModal').classList.remove('active');
        let finalData;

        if(mode === 'merge'){
          const ids = new Set(currentData.map(w => w.id));
          const newItems = importedData.filter(w => !ids.has(w.id));
          finalData = [...currentData,...newItems];
          showNotification(`✓ ${newItems.length} vin(s) ajouté(s). Total: ${finalData.length}`, 'success');
        } else {
          finalData = importedData;
          showNotification(`✓ Liste remplacée. Total: ${finalData.length} vin(s)`, 'success');
        }

        localStorage.setItem('wineList', JSON.stringify(finalData));
        loadRecent();
        loadRank();
      };

      el('btnMerge').onclick = () => doImport('merge');
      el('btnOverwrite').onclick = () => doImport('overwrite');
      el('btnCancel').onclick = () => el('importModal').classList.remove('active');

    } catch(err) {
      showNotification('❌ Fichier invalide: ' + err.message, 'error', 4000);
    }
  };
  reader.onerror = () => {
    showNotification('❌ Erreur lecture fichier', 'error');
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ===== SERVICE WORKER =====
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.error('SW error:', err));
  });
}

// ===== INIT =====
initApp();
</script>
</body>
</html>
